<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GRIDPULSE CONQUEST - Multijoueur Complet</title>
    <style>
        body { margin: 0; background: #050811; color: #00ffff; font-family: 'Courier New', monospace; overflow: hidden; text-align: center; }
        canvas { background: #0b0f19; display: block; margin: 10px auto; border: 2px solid #00ffff; box-shadow: 0 0 25px rgba(0,255,255,0.4); }
        #hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 16px; text-shadow: 0 0 10px #00ffff; background: rgba(0,0,0,0.7); padding: 8px 20px; border: 1px solid #00ffff; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="hud">GRIDPULSE CONQUEST | ZQSD/Flèches pour bouger | ESPACE pour tirer</div>
    <canvas id="gameCanvas" width="900" height="600"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let myPlayer = { x: 450, y: 300, angle: 0, hp: 100, maxHp: 100, color: '#00ffff', score: 0 };
        let players = {};
        let bullets = [];
        let mapObstacles = [
            { x: 200, y: 150, w: 100, h: 40 },
            { x: 600, y: 150, w: 100, h: 40 },
            { x: 400, y: 300, w: 100, h: 100 },
            { x: 200, y: 450, w: 100, h: 40 },
            { x: 600, y: 450, w: 100, h: 40 }
        ];

        let keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                // Tirer un projectile
                const angle = myPlayer.angle;
                const bx = myPlayer.x + Math.cos(angle) * 25;
                const by = myPlayer.y + Math.sin(angle) * 25;
                socket.emit('playerShoot', { x: bx, y: by, angle: angle });
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Gestion des mouvements de la souris pour viser
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            myPlayer.angle = Math.atan2(mouseY - myPlayer.y, mouseX - myPlayer.x);
        });

        // Réception de l'état global du serveur
        socket.on('gameState', (state) => {
            players = state.players;
            bullets = state.bullets;
            if (players[socket.id]) {
                myPlayer.hp = players[socket.id].hp;
                myPlayer.score = players[socket.id].score;
            }
        });

        function update() {
            let speed = 4;
            let dx = 0;
            let dy = 0;

            if (keys['ArrowUp'] || keys['KeyW']) dy -= speed;
            if (keys['ArrowDown'] || keys['KeyS']) dy += speed;
            if (keys['ArrowLeft'] || keys['KeyA']) dx -= speed;
            if (keys['ArrowRight'] || keys['KeyD']) dx += speed;

            if (dx !== 0 || dy !== 0) {
                myPlayer.x += dx;
                myPlayer.y += dy;

                // Collision avec les bords de la map
                myPlayer.x = Math.max(20, Math.min(canvas.width - 20, myPlayer.x));
                myPlayer.y = Math.max(20, Math.min(canvas.height - 20, myPlayer.y));

                // Collision basique avec les obstacles
                mapObstacles.forEach(obs => {
                    if (myPlayer.x > obs.x && myPlayer.x < obs.x + obs.w &&
                        myPlayer.y > obs.y && myPlayer.y < obs.y + obs.h) {
                        myPlayer.x -= dx;
                        myPlayer.y -= dy;
                    }
                });

                // Envoyer la position au serveur
                socket.emit('playerMovement', {
                    x: myPlayer.x,
                    y: myPlayer.y,
                    angle: myPlayer.angle
                });
            }
        }

        function drawGrid() {
            ctx.strokeStyle = '#101c2e';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            // Dessiner la map (obstacles)
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            mapObstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            });

            // Dessiner les balles / projectiles
            ctx.fillStyle = '#ff0055';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Dessiner tous les joueurs
            for (let id in players) {
                let p = players[id];
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);

                // Corps du vaisseau
                ctx.fillStyle = p.color || '#00ffff';
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-10, -10);
                ctx.lineTo(-5, 0);
                ctx.lineTo(-10, 10);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
                ctx.restore();

                // Barre de vie au-dessus du joueur
                ctx.fillStyle = 'red';
                ctx.fillRect(p.x - 20, p.y - 30, 40, 5);
                ctx.fillStyle = 'lime';
                ctx.fillRect(p.x - 20, p.y - 30, (p.hp / p.maxHp) * 40, 5);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
